name: "Build iOS app"

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build_simulator:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Xcode version
        run: xcodebuild -version
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild -scheme Stoat \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -sdk iphonesimulator \
          -configuration Release \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          clean build
      - name: Archive simulator app
        uses: actions/upload-artifact@v4
        with:
          name: tailstalk2-ios-simulator
          path: ${{ github.workspace }}/build/Release-iphonesimulator/Stoat.app
          retention-days: 5
